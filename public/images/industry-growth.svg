<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="t d"><title id="t">Industry-specific digital growth funnel</title><desc id="d">A funnel showing local discovery, paid acquisition, conversion and follow-up tailored to an industry.</desc><rect width="1600" height="760" fill="#0b0b0c"/><text x="100" y="90" fill="#B22222" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">R.K DIGITAL MEDIA / INDUSTRY SYSTEM</text><text x="100" y="150" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="800">FROM SEARCH TO CUSTOMER ACTION</text><g fill="#151518" stroke="#303034"><path d="M170 235h1260l-115 100H285z"/><path d="M285 370h1030l-115 100H400z"/><path d="M400 505h800l-115 100H515z"/></g><g fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="800" text-anchor="middle"><text x="800" y="295">DISCOVERY — SEARCH / MAPS / ADS</text><text x="800" y="430">CONSIDERATION — WEBSITE / OFFER / TRUST</text><text x="800" y="565">ACTION — CALL / FORM / BOOKING / PURCHASE</text></g><path d="M800 620v65" stroke="#B22222" stroke-width="5"/><text x="800" y="725" text-anchor="middle" fill="#B22222" font-family="Arial,sans-serif" font-size="24" font-weight="800">FOLLOW-UP + MEASUREMENT</text></svg>