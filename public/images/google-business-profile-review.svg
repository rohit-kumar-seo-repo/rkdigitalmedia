  <text x="504" y="711" fill="#999" font-family="Arial, sans-serif" font-size="15">Connect profile information to relevant services and location pages</text>
  <text x="1458" y="700" text-anchor="end" fill="#f16a6c" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">REVIEW FOCUS</text>

  <rect x="416" y="758" width="1078" height="46" rx="12" fill="#221516" stroke="#e8282b" stroke-opacity=".45"/>
  <text x="440" y="787" fill="#f5c5c5" font-family="Arial, sans-serif" font-size="14" font-weight="700">Illustrative workflow</text>
  <text x="1468" y="787" text-anchor="end" fill="#c3aaaa" font-family="Arial, sans-serif" font-size="14">Not a real profile, client report or performance result</text>
