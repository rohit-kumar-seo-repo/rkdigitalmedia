  <circle cx="151" cy="454" r="6" fill="#858585"/>
  <text x="173" y="460" fill="#bbb" font-family="Arial, sans-serif" font-size="17">Profile updates</text>
  <circle cx="151" cy="516" r="6" fill="#858585"/>
  <text x="173" y="522" fill="#bbb" font-family="Arial, sans-serif" font-size="17">Website alignment</text>
