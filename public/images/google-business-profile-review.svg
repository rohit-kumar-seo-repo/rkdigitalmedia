<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Google Business Profile review workflow</title>
  <desc id="desc">A conceptual profile audit dashboard showing business information, categories, services, reviews, updates and website alignment. It contains no client data or performance results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111"/>
      <stop offset="1" stop-color="#1b1b1b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#e8282b"/>
      <stop offset="1" stop-color="#ff5759"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1450" cy="80" r="330" fill="#e8282b" opacity=".055"/>
  <rect x="74" y="64" width="1452" height="772" rx="28" fill="#101010" stroke="#373737" stroke-width="2"/>
