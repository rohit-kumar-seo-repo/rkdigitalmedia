  <rect x="440" y="564" width="42" height="42" rx="12" fill="#2a1718"/>
  <path d="M451 577h20v15h-20zm4-4v4m12-4v4" fill="none" stroke="#f16a6c" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="504" y="577" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Reviews &amp; profile updates</text>
  <text x="504" y="605" fill="#999" font-family="Arial, sans-serif" font-size="15">A legitimate request process, useful responses and relevant changes</text>
  <text x="1458" y="594" text-anchor="end" fill="#f16a6c" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">REVIEW FOCUS</text>

