  <text x="504" y="499" fill="#999" font-family="Arial, sans-serif" font-size="15">Match the real business and help customers understand the offer</text>
  <text x="1458" y="488" text-anchor="end" fill="#f16a6c" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">REVIEW FOCUS</text>

