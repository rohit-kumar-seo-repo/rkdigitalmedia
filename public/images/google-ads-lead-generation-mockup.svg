<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Google Ads lead generation campaign mockup</title>
<desc id="desc">A premium dark interface showing Search, Ad, Landing Page and Lead as a connected Google Ads acquisition flow.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c0f"/><stop offset="1" stop-color="#17191d"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B22222"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000" flood-opacity=".42"/></filter>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<g opacity=".12" stroke="#fff"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/><path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g>
<text x="80" y="92" fill="#ef4444" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">R.K DIGITAL MEDIA / GOOGLE ADS</text>
<text x="80" y="148" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="800">SEARCH → AD → LANDING PAGE → LEAD</text>
<text x="80" y="185" fill="#9ca3af" font-family="Arial, sans-serif" font-size="20">A practical campaign flow built around intent, relevance and measurable conversions.</text>

<g filter="url(#shadow)">
<rect x="70" y="245" width="340" height="480" rx="22" fill="#111318" stroke="#30343b"/>
<rect x="440" y="245" width="340" height="480" rx="22" fill="#111318" stroke="#30343b"/>
<rect x="810" y="245" width="340" height="480" rx="22" fill="#111318" stroke="#30343b"/>
<rect x="1180" y="245" width="350" height="480" rx="22" fill="#111318" stroke="#30343b"/>
</g>

<g font-family="Arial, sans-serif">
