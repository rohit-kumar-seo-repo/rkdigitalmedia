<rect x="314" y="522" width="258" height="82" rx="14" fill="#181c1c" stroke="#3c4242"/><circle cx="340" cy="548" r="13" fill="#e8282b"/><text x="340" y="553" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="363" y="549" font-size="14" font-weight="700" fill="#f0eeee">Map searches</text><text x="363" y="570" font-size="11" fill="#9ba1a1">Buyer intent and exclusions</text>
<rect x="590" y="522" width="258" height="82" rx="14" fill="#181c1c" stroke="#3c4242"/><circle cx="616" cy="548" r="13" fill="#e8282b"/><text x="616" y="553" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="639" y="549" font-size="14" font-weight="700" fill="#f0eeee">Align the page</text><text x="639" y="570" font-size="11" fill="#9ba1a1">Message and next action</text>
<rect x="866" y="522" width="296" height="82" rx="14" fill="#181c1c" stroke="#3c4242"/><circle cx="892" cy="548" r="13" fill="#e8282b"/><text x="892" y="553" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="915" y="549" font-size="14" font-weight="700" fill="#f0eeee">Measure</text><text x="915" y="570" font-size="11" fill="#9ba1a1">Enquiry quality and feedback</text></g>
