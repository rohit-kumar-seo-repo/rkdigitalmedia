<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Buyer-search map sample layout</title><desc id="desc">A sample property buyer-search strategy sheet showing project context, buyer search themes, exclusions, landing page message and enquiry tracking.</desc>
