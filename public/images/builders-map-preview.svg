<rect width="1200" height="675" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="27" fill="none" stroke="#3b4040" stroke-width="2"/>
<rect x="38" y="34" width="1124" height="86" rx="18" fill="#151919" stroke="#383d3d"/><rect x="58" y="53" width="46" height="46" rx="12" fill="#e8282b"/><text x="81" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="17" fill="#fff">RK</text>
<text x="124" y="65" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#e8282b">R.K DIGITAL MEDIA</text><text x="124" y="91" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#f7f7f5">BUYER-SEARCH MAP</text><rect x="944" y="56" width="190" height="40" rx="20" fill="#252929" stroke="#505454"/><circle cx="964" cy="76" r="5" fill="#e8282b"/><text x="980" y="81" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#f0eeee">SAMPLE LAYOUT</text>
<text x="48" y="158" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#a5aaaa">01 / PROJECT CONTEXT</text>
<rect x="38" y="174" width="542" height="112" rx="16" fill="#181c1c" stroke="#3c4242"/><text x="60" y="207" font-family="Arial,sans-serif" font-size="12" fill="#9ba1a1">PROJECT / LOCATION</text><path d="M60 224h270" stroke="#626969" stroke-width="7" stroke-linecap="round"/><path d="M60 245h190" stroke="#414848" stroke-width="7" stroke-linecap="round"/><rect x="407" y="194" width="145" height="64" rx="12" fill="#282c2c"/><path d="M430 238v-22l22-16 22 16v22M441 238v-13h12v13" fill="none" stroke="#e8282b" stroke-width="2.5"/><path d="M488 214h42M488 226h32M488 238h22" stroke="#818888" stroke-width="4" stroke-linecap="round"/>
<text x="620" y="158" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#a5aaaa">02 / BUYER INTENT</text><rect x="610" y="174" width="552" height="112" rx="16" fill="#181c1c" stroke="#3c4242"/><rect x="632" y="195" width="132" height="32" rx="8" fill="#382020" stroke="#e8282b"/><text x="698" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffb0ad">BUYER SEARCH</text><text x="784" y="207" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#f0eeee">3 BHK flat in [area]</text><text x="784" y="228" font-family="Arial,sans-serif" font-size="12" fill="#9ba1a1">Property type + location + budget</text><path d="M632 250h492" stroke="#343a3a" stroke-width="1"/><text x="632" y="270" font-family="Arial,sans-serif" font-size="11" fill="#a5aaaa">Match themes to the actual inventory and offer.</text>
<text x="48" y="324" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#a5aaaa">03 / SEARCH EXCLUSIONS TO REVIEW</text>
<rect x="38" y="340" width="542" height="120" rx="16" fill="#181c1c" stroke="#3c4242"/><g font-family="Arial,sans-serif" font-size="13" fill="#d7dada"><rect x="58" y="360" width="12" height="12" rx="3" fill="#e8282b"/><text x="82" y="371">Rental-only intent</text><rect x="58" y="390" width="12" height="12" rx="3" fill="#e8282b"/><text x="82" y="401">Broker / agent searches</text><rect x="300" y="360" width="12" height="12" rx="3" fill="#e8282b"/><text x="324" y="371">Mismatched property type</text><rect x="300" y="390" width="12" height="12" rx="3" fill="#e8282b"/><text x="324" y="401">Irrelevant locations</text></g><text x="58" y="438" font-family="Arial,sans-serif" font-size="11" fill="#8f9797">Validate against campaign goals before excluding.</text>
<text x="620" y="324" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#a5aaaa">04 / LANDING PAGE + ENQUIRY</text><rect x="610" y="340" width="552" height="120" rx="16" fill="#181c1c" stroke="#3c4242"/><rect x="632" y="359" width="220" height="61" rx="10" fill="#252a2a"/><path d="M648 376h164M648 389h125" stroke="#7c8585" stroke-width="5" stroke-linecap="round"/><rect x="648" y="400" width="98" height="9" rx="4.5" fill="url(#red)"/><path d="M872 389h35" stroke="#e8282b" stroke-width="2.5" stroke-linecap="round"/><path d="m899 381 9 8-9 8" fill="none" stroke="#e8282b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="941" cy="389" r="21" fill="#252a2a" stroke="#e8282b"/><path d="m931 389 7 7 13-15" fill="none" stroke="#f0eeee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="978" y="383" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f0eeee">Enquiry tracked</text><text x="978" y="403" font-family="Arial,sans-serif" font-size="11" fill="#9ba1a1">Source + lead context</text><text x="48" y="505" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#a5aaaa">WORKFLOW</text>
