<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Google Ads lead generation visual</title><desc id="d">A visual funnel showing search intent moving through an ad and landing page into a qualified lead.</desc><rect width="1600" height="900" fill="#0b0b0c"/><path d="M0 0h1600v900H0z" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141416"/><stop offset="1" stop-color="#080809"/></linearGradient></defs><text x="110" y="120" fill="#B22222" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="5">R.K DIGITAL MEDIA / GOOGLE ADS</text><text x="110" y="195" fill="#fff" font-family="Arial,sans-serif" font-size="62" font-weight="800">SEARCH → AD → LEAD</text><text x="110" y="245" fill="#9b9b9f" font-family="Arial,sans-serif" font-size="26">Turn high-intent searches into measurable enquiries.</text><g transform="translate(110 330)"><rect width="270" height="230" rx="20" fill="#151518" stroke="#303034"/><circle cx="62" cy="65" r="25" fill="#B22222"/><text x="105" y="75" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">SEARCH</text><text x="32" y="130" fill="#9b9b9f" font-family="Arial,sans-serif" font-size="20">Intent</text><text x="32" y="165" fill="#fff" font-family="Arial,sans-serif" font-size="22">“service near me”</text></g><path d="M405 445h105" stroke="#B22222" stroke-width="5"/><path d="m495 425 25 20-25 20" fill="none" stroke="#B22222" stroke-width="5"/><g transform="translate(550 330)"><rect width="270" height="230" rx="20" fill="#151518" stroke="#303034"/><circle cx="62" cy="65" r="25" fill="#B22222"/><text x="105" y="75" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">AD</text><text x="32" y="130" fill="#9b9b9f" font-family="Arial,sans-serif" font-size="20">Message</text><text x="32" y="165" fill="#fff" font-family="Arial,sans-serif" font-size="22">Relevant offer</text></g><path d="M845 445h105" stroke="#B22222" stroke-width="5"/><path d="m935 425 25 20-25 20" fill="none" stroke="#B22222" stroke-width="5"/><g transform="translate(990 330)"><rect width="270" height="230" rx="20" fill="#151518" stroke="#303034"/><circle cx="62" cy="65" r="25" fill="#B22222"/><text x="105" y="75" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">LEAD</text><text x="32" y="130" fill="#9b9b9f" font-family="Arial,sans-serif" font-size="20">Action</text><text x="32" y="165" fill="#fff" font-family="Arial,sans-serif" font-size="22">Call / Form / WhatsApp</text></g><text x="110" y="700" fill="#77777d" font-family="Arial,sans-serif" font-size="22">FOCUS ON QUALIFIED LEADS — NOT CLICKS ALONE</text><rect x="110" y="750" width="1080" height="4" fill="#B22222"/></svg>