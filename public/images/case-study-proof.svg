<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="t d"><title id="t">Case study evidence framework</title><desc id="d">A three-stage case study framework separating problem, intervention and outcome.</desc><rect width="1600" height="760" fill="#0b0b0c"/><text x="100" y="90" fill="#B22222" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">R.K DIGITAL MEDIA / CASE STUDIES</text><text x="100" y="150" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="800">READ THE RESULT IN CONTEXT</text><g fill="#151518" stroke="#303034" stroke-width="2"><rect x="110" y="260" width="400" height="220" rx="20"/><rect x="600" y="260" width="400" height="220" rx="20"/><rect x="1090" y="260" width="400" height="220" rx="20"/></g><g fill="#B22222" font-family="Arial,sans-serif" font-size="19" font-weight="800"><text x="145" y="305">01 / PROBLEM</text><text x="635" y="305">02 / INTERVENTION</text><text x="1125" y="305">03 / OUTCOME</text></g><g fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700"><text x="145" y="360">What was limiting</text><text x="145" y="398">growth before the work?</text><text x="635" y="360">What was changed,</text><text x="635" y="398">built or corrected?</text><text x="1125" y="360">What measurable</text><text x="1125" y="398">result was documented?</text></g><path d="M510 370h75M1000 370h75" stroke="#B22222" stroke-width="5"/><path d="m565 350 25 20-25 20M1055 350l25 20-25 20" fill="none" stroke="#B22222" stroke-width="5"/><text x="100" y="620" fill="#9b9b9f" font-family="Arial,sans-serif" font-size="23">RESULTS VARY BY STARTING POSITION, BUDGET, MARKET, COMPETITION AND IMPLEMENTATION.</text></svg>