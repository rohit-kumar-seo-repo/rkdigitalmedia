<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AI automation lead workflow visual</title><desc id="d">A workflow connecting a lead trigger to qualification, CRM routing, follow-up and human handoff.</desc><rect width="1600" height="900" fill="#0b0b0c"/><text x="110" y="120" fill="#B22222" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="5">R.K DIGITAL MEDIA / AUTOMATION</text><text x="110" y="195" fill="#fff" font-family="Arial,sans-serif" font-size="58" font-weight="800">AUTOMATE THE HANDOFF</text><text x="110" y="245" fill="#9b9b9f" font-family="Arial,sans-serif" font-size="26">Capture → qualify → route → follow up → involve a human.</text><g transform="translate(110 360)"><g fill="#151518" stroke="#303034"><rect width="230" height="160" rx="18"/><rect x="285" width="230" height="160" rx="18"/><rect x="570" width="230" height="160" rx="18"/><rect x="855" width="230" height="160" rx="18"/><rect x="1140" width="230" height="160" rx="18"/></g><g fill="#B22222"><circle cx="40" cy="42" r="12"/><circle cx="325" cy="42" r="12"/><circle cx="610" cy="42" r="12"/><circle cx="895" cy="42" r="12"/><circle cx="1180" cy="42" r="12"/></g><g fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="800"><text x="30" y="92">TRIGGER</text><text x="315" y="92">QUALIFY</text><text x="600" y="92">CRM</text><text x="885" y="92">FOLLOW-UP</text><text x="1170" y="92">HUMAN</text></g><g fill="#9b9b9f" font-family="Arial,sans-serif" font-size="17"><text x="30" y="125">Form / chat</text><text x="315" y="125">Rules / data</text><text x="600" y="125">Assign owner</text><text x="885" y="125">Email / WhatsApp</text><text x="1170" y="125">Sales action</text></g><g stroke="#B22222" stroke-width="4"><path d="M235 80h40"/><path d="M520 80h40"/><path d="M805 80h40"/><path d="M1090 80h40"/></g></g><text x="110" y="700" fill="#77777d" font-family="Arial,sans-serif" font-size="22">AUTOMATION SHOULD REMOVE REPETITIVE WORK — NOT REMOVE JUDGEMENT</text><rect x="110" y="750" width="1080" height="4" fill="#B22222"/></svg>